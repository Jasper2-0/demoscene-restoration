<!doctype html>
<meta charset="utf-8">
<title>Lapsus — Mature Furk, Assembly 2000</title>
<style>
  html, body { margin: 0; background: #000; height: 100%; overflow: hidden; }
  /* The original ran 640x480 (Display ctor, ENGINE.md §2). Letterbox into the
     window rather than stretch: a wrong aspect ratio is the one distortion a
     viewer notices instantly. At a 640x480 viewport this resolves to exactly
     640x480, which is what the verification harness screenshots. */
  #wrap { position: fixed; inset: 0; display: grid; place-items: center; }
  canvas { display: block; width: min(100vw, 133.333vh); height: min(75vw, 100vh);
           image-rendering: pixelated; }
  #ui { position: fixed; left: 0; right: 0; bottom: 7%; text-align: center;
        font: 500 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: .2em; text-transform: uppercase;
        color: #8c8c8c; pointer-events: none; text-shadow: 0 0 12px #000; }
</style>
<div id="wrap"><canvas id="c" width="640" height="480"></canvas></div>
<div id="ui"></div>
<script type="module" src="js/main.js"></script>
