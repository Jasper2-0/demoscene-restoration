<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>lost vegas — vector glyph editor</title>
<style>
  :root { --bg:#101418; --panel:#171d23; --line:#2a343d; --ink:#d7b45a; --sky:#7dafc8; --txt:#c8d2da; --hot:#5ad7a0; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:13px/1.45 ui-monospace,Menlo,monospace; overflow:hidden; }
  header { padding:8px 14px; border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  h1 { font-size:14px; margin:0; color:var(--ink); font-weight:600; }
  .hint { color:#7d8b97; font-size:12px; }
  button { background:#222c35; color:var(--txt); border:1px solid var(--line); padding:4px 9px;
           font:inherit; cursor:pointer; border-radius:3px; }
  button:hover { background:#2c3843; } button.pri { background:var(--ink); color:#12181d; border-color:var(--ink); font-weight:600; }
  button.on { background:var(--hot); color:#10201a; border-color:var(--hot); }
  main { display:grid; grid-template-columns:180px 1fr 300px; height:calc(100vh - 43px); }
  #strip { border-right:1px solid var(--line); overflow-y:auto; padding:6px; }
  .g { display:flex; align-items:center; gap:8px; padding:3px 6px; border-radius:3px; cursor:pointer; }
  .g:hover { background:#1d252c; } .g.sel { background:#243039; outline:1px solid var(--ink); }
  .g canvas { background:#0c1013; border:1px solid #232c34; }
  .g .n { color:#7d8b97; } .g.done .n { color:var(--hot); }
  #stage { position:relative; overflow:hidden; background:#0c1013; }
  #edit { position:absolute; inset:0; cursor:crosshair; }
  #side { border-left:1px solid var(--line); padding:10px; overflow-y:auto; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:9px; margin-bottom:10px; }
  .card h2 { font-size:11px; margin:0 0 7px; color:#7d8b97; font-weight:500; text-transform:uppercase; letter-spacing:.06em; }
  label { display:flex; gap:7px; align-items:center; color:#7d8b97; margin:3px 0; }
  input[type=range] { flex:1; }
  textarea { width:100%; height:90px; background:#0c1013; color:var(--txt); border:1px solid var(--line);
             font:11px ui-monospace,monospace; padding:6px; border-radius:3px; }
  #prev { background:var(--sky); border:1px solid var(--line); display:block; width:100%; }
  kbd { background:#222c35; border:1px solid var(--line); border-radius:3px; padding:0 4px; }
</style>
</head>
<body>
<header>
  <h1>vector glyph editor</h1>
  <span class="hint"><kbd>click</kbd> add point · <kbd>drag</kbd> point to move · <kbd>alt+click</kbd> delete ·
    <kbd>c</kbd> close contour · <kbd>n</kbd> new contour · <kbd>⌫</kbd> undo point · <kbd>←/→</kbd> glyph · <kbd>g</kbd> grid</span>
  <button id="autotrace">auto-trace</button>
  <button id="clear">clear glyph</button>
  <button id="save" class="pri">export JSON</button>
  <span id="stat" class="hint"></span>
</header>
<main>
  <div id="strip"></div>
  <div id="stage"><canvas id="edit"></canvas></div>
  <div id="side">
    <div class="card">
      <h2>reference</h2>
      <label>bitmap <input type="range" id="op" min="0" max="100" value="55"></label>
      <label>zoom <input type="range" id="zm" min="4" max="34" value="16"></label>
      <label><input type="checkbox" id="grid" checked> pixel grid</label>
      <label><input type="checkbox" id="snap" checked> snap to ½ px</label>
      <label><input type="checkbox" id="fill" checked> fill preview</label>
    </div>
    <div class="card">
      <h2>preview (vector)</h2>
      <canvas id="prev" width="280" height="170"></canvas>
    </div>
    <div class="card">
      <h2>export</h2>
      <textarea id="out" readonly></textarea>
      <div style="margin-top:6px; display:flex; gap:6px">
        <button id="copy">copy</button><button id="load">import…</button>
      </div>
      <input type="file" id="file" accept="application/json" style="display:none">
    </div>
  </div>
</main>
<script type="module">
const ORDER = 'abcdefghijklmnopqrstuvwxyz0123456789#+'.split('');
const KEY = 'lv_vector_glyphs_v1';

const [img, metrics] = await Promise.all([
  new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src='../assets/font.png';}),
  fetch('../assets/font_metrics.json').then(r=>r.json()),
]);
const G = metrics.glyphs;

// atlas alpha, for the backdrop and the auto-tracer
const ac=document.createElement('canvas'); ac.width=img.width; ac.height=img.height;
const actx=ac.getContext('2d',{willReadFrequently:true}); actx.drawImage(img,0,0);
const A=actx.getImageData(0,0,img.width,img.height).data;
const lit=(x,y)=> x>=0&&y>=0&&x<img.width&&y<img.height && A[(y*img.width+x)*4+3]>96;

// model: { ch: { contours: [ [ {x,y}, ... ], ... ] } }  coords in glyph-cell px
let doc = JSON.parse(localStorage.getItem(KEY) || '{}');
let sel = 'a', cur = null, drag = null;

const cell = (ch) => { const g=G[ch]; return g ? {w:g.w, h:g.h, x0:g.x0, y0:g.y0} : {w:16,h:19,x0:0,y0:0}; };
const contoursOf = (ch) => (doc[ch] ||= { contours: [] }).contours;

/* ---------- auto-trace: marching-squares outline of the bitmap ---------- */
function autoTrace(ch){
  const c = cell(ch);
  const inside = (x,y)=> lit(c.x0+x, c.y0+y);
  const seen = new Set(); const out = [];
  // walk the boundary of each 4-connected blob with a simple square tracer
  for (let y=0;y<c.h;y++) for (let x=0;x<c.w;x++){
    if (!inside(x,y) || seen.has(x+','+y)) continue;
    // only start on a left edge
    if (inside(x-1,y)) continue;
    const path=[]; let px=x, py=y, dir=0;   // 0=R 1=D 2=L 3=U
    const start = px+','+py; let guard=0;
    do {
      seen.add(px+','+py); path.push({x:px, y:py});
      // turn right if possible, else straight, else left, else back
      const step=[[1,0],[0,1],[-1,0],[0,-1]];
      let moved=false;
      for (const t of [3,0,1,2]) {          // prefer turning "up" then forward
        const nd=(dir+t)%4, [dx,dy]=step[nd];
        if (inside(px+dx,py+dy)) { px+=dx; py+=dy; dir=nd; moved=true; break; }
      }
      if (!moved) break;
    } while ((px+','+py)!==start && ++guard<4000);
    if (path.length>2) out.push(simplify(path));
  }
  return out;
}
/* collapse collinear runs so traced outlines are editable, not 300 points */
function simplify(p){
  const r=[];
  for (let i=0;i<p.length;i++){
    const a=p[(i-1+p.length)%p.length], b=p[i], c=p[(i+1)%p.length];
    const cross=(b.x-a.x)*(c.y-a.y)-(b.y-a.y)*(c.x-a.x);
    if (cross!==0) r.push({x:b.x, y:b.y});
  }
  return r.length>2 ? r : p;
}

/* ------------------------------ editor view ------------------------------ */
const stage=document.getElementById('stage'), cv=document.getElementById('edit');
function view(){
  const Z=+document.getElementById('zm').value, c=cell(sel);
  const ox=Math.round((cv.width  - c.w*Z)/2), oy=Math.round((cv.height - c.h*Z)/2);
  return {Z, ox, oy, c};
}
const toGlyph=(mx,my)=>{ const {Z,ox,oy}=view();
  let x=(mx-ox)/Z, y=(my-oy)/Z;
  if (document.getElementById('snap').checked){ x=Math.round(x*2)/2; y=Math.round(y*2)/2; }
  return {x,y}; };

function drawEditor(){
  cv.width=stage.clientWidth; cv.height=stage.clientHeight;
  const g=cv.getContext('2d'); const {Z,ox,oy,c}=view();
  g.fillStyle='#0c1013'; g.fillRect(0,0,cv.width,cv.height);
  // bitmap reference
  g.save(); g.globalAlpha=+document.getElementById('op').value/100;
  g.imageSmoothingEnabled=false;
  g.drawImage(img, c.x0, c.y0, c.w, c.h, ox, oy, c.w*Z, c.h*Z);
  g.restore();
  // grid + cell
  if (document.getElementById('grid').checked && Z>=8){
    g.strokeStyle='rgba(255,255,255,.07)'; g.lineWidth=1; g.beginPath();
    for(let i=0;i<=c.w;i++){ g.moveTo(ox+i*Z+.5,oy); g.lineTo(ox+i*Z+.5,oy+c.h*Z); }
    for(let j=0;j<=c.h;j++){ g.moveTo(ox,oy+j*Z+.5); g.lineTo(ox+c.w*Z,oy+j*Z+.5); }
    g.stroke();
  }
  g.strokeStyle='#3b4854'; g.strokeRect(ox+.5,oy+.5,c.w*Z,c.h*Z);
  // contours
  const cs=contoursOf(sel);
  cs.forEach((pts,ci)=>{
    if(!pts.length) return;
    g.beginPath();
    pts.forEach((p,i)=> i? g.lineTo(ox+p.x*Z, oy+p.y*Z) : g.moveTo(ox+p.x*Z, oy+p.y*Z));
    if (ci!==cur) g.closePath();
    if (document.getElementById('fill').checked && ci!==cur){ g.fillStyle='rgba(215,180,90,.30)'; g.fill(); }
    g.strokeStyle = ci===cur ? '#5ad7a0' : '#d7b45a'; g.lineWidth=1.6; g.stroke();
    pts.forEach((p,i)=>{ g.fillStyle = (ci===cur && i===pts.length-1) ? '#5ad7a0' : '#d7b45a';
      g.fillRect(ox+p.x*Z-2.5, oy+p.y*Z-2.5, 5,5); });
  });
  document.getElementById('stat').textContent =
    `'${sel}'  cell ${c.w}x${c.h}  ${cs.length} contour(s), ${cs.reduce((a,p)=>a+p.length,0)} pts  ·  ${ORDER.filter(k=>doc[k]?.contours?.length).length}/${ORDER.length} glyphs done`;
}

/* ------------------------------ strip + preview ------------------------------ */
function drawStrip(){
  const s=document.getElementById('strip'); s.innerHTML='';
  for (const ch of ORDER){
    const d=document.createElement('div');
    d.className='g'+(ch===sel?' sel':'')+(doc[ch]?.contours?.length?' done':'');
    const c=cell(ch), k=document.createElement('canvas'); k.width=34; k.height=26;
    const g=k.getContext('2d'); g.imageSmoothingEnabled=false;
    const z=Math.min(30/c.w, 22/c.h);
    g.drawImage(img,c.x0,c.y0,c.w,c.h, 2,2, c.w*z, c.h*z);
    if (doc[ch]?.contours?.length){
      g.strokeStyle='#5ad7a0'; g.lineWidth=1;
      for(const pts of doc[ch].contours){ if(!pts.length)continue; g.beginPath();
        pts.forEach((p,i)=> i? g.lineTo(2+p.x*z,2+p.y*z) : g.moveTo(2+p.x*z,2+p.y*z));
        g.closePath(); g.stroke(); }
    }
    const n=document.createElement('span'); n.className='n'; n.textContent=ch;
    d.append(k,n); d.onclick=()=>{ sel=ch; cur=null; redraw(); };
    s.appendChild(d);
  }
}
function drawPreview(){
  const k=document.getElementById('prev'), g=k.getContext('2d');
  g.fillStyle='#7dafc8'; g.fillRect(0,0,k.width,k.height);
  const lines=['lost vegas','threestate','abcdefg'];
  let y=14;
  for (const line of lines){
    let x=8; const S=1.5;
    for (const ch of line){
      if (ch===' '){ x+=10*S; continue; }
      const c=cell(ch), cs=doc[ch]?.contours||[];
      if (cs.length){
        g.fillStyle='#fff'; g.beginPath();
        for(const pts of cs){ if(!pts.length)continue;
          pts.forEach((p,i)=> i? g.lineTo(x+p.x*S, y+p.y*S) : g.moveTo(x+p.x*S, y+p.y*S));
          g.closePath(); }
        g.fill('evenodd');
      } else {   // not yet drawn — show the bitmap so progress is visible
        g.save(); g.globalAlpha=.35; g.imageSmoothingEnabled=false;
        g.drawImage(img,c.x0,c.y0,c.w,c.h, x, y, c.w*S, c.h*S); g.restore();
      }
      x += (c.w+4)*S;
    }
    y += 52;
  }
}
function exportJSON(){
  const out={ note:'Vector glyph outlines for the Lost Vegas remaster. Coordinates are in glyph-cell pixels (origin = cell top-left), contours are closed polygons, even-odd fill.', unitsPerCell:1, glyphs:{} };
  for (const ch of ORDER) if (doc[ch]?.contours?.length){
    const c=cell(ch);
    out.glyphs[ch]={ w:c.w, h:c.h, contours: doc[ch].contours.map(p=>p.map(q=>[q.x,q.y])) };
  }
  document.getElementById('out').value=JSON.stringify(out);
  return out;
}
function redraw(){ drawEditor(); drawStrip(); drawPreview(); exportJSON();
  localStorage.setItem(KEY, JSON.stringify(doc)); }

/* ------------------------------ interaction ------------------------------ */
cv.addEventListener('mousedown', e=>{
  const r=cv.getBoundingClientRect(); const mx=e.clientX-r.left, my=e.clientY-r.top;
  const {Z,ox,oy}=view(); const cs=contoursOf(sel);
  // hit-test existing points
  for (let ci=0;ci<cs.length;ci++) for (let i=0;i<cs[ci].length;i++){
    const p=cs[ci][i];
    if (Math.abs(ox+p.x*Z-mx)<5 && Math.abs(oy+p.y*Z-my)<5){
      if (e.altKey){ cs[ci].splice(i,1); if(!cs[ci].length) cs.splice(ci,1); redraw(); return; }
      drag={ci,i}; return;
    }
  }
  if (e.altKey) return;
  const p=toGlyph(mx,my);
  if (cur===null){ cs.push([p]); cur=cs.length-1; } else cs[cur].push(p);
  redraw();
});
addEventListener('mousemove', e=>{
  if (!drag) return;
  const r=cv.getBoundingClientRect();
  const p=toGlyph(e.clientX-r.left, e.clientY-r.top);
  const c=contoursOf(sel)[drag.ci]; if(c&&c[drag.i]){ c[drag.i].x=p.x; c[drag.i].y=p.y; redraw(); }
});
addEventListener('mouseup', ()=>{ drag=null; });
addEventListener('keydown', e=>{
  if (e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT') return;
  const cs=contoursOf(sel);
  if (e.key==='c'||e.key==='n'){ cur=null; redraw(); }
  else if (e.key==='Backspace'){ if(cur!==null&&cs[cur]?.length){ cs[cur].pop(); if(!cs[cur].length){cs.splice(cur,1);cur=null;} redraw(); } e.preventDefault(); }
  else if (e.key==='ArrowRight'){ sel=ORDER[(ORDER.indexOf(sel)+1)%ORDER.length]; cur=null; redraw(); e.preventDefault(); }
  else if (e.key==='ArrowLeft'){ sel=ORDER[(ORDER.indexOf(sel)+ORDER.length-1)%ORDER.length]; cur=null; redraw(); e.preventDefault(); }
  else if (e.key==='g'){ const b=document.getElementById('grid'); b.checked=!b.checked; redraw(); }
});
document.getElementById('autotrace').onclick=()=>{
  doc[sel]={contours: autoTrace(sel)}; cur=null; redraw();
};
document.getElementById('clear').onclick=()=>{ doc[sel]={contours:[]}; cur=null; redraw(); };
document.getElementById('save').onclick=()=>{
  const blob=new Blob([JSON.stringify(exportJSON(),null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='font_vectors.json'; a.click();
};
document.getElementById('copy').onclick=async()=>{
  await navigator.clipboard.writeText(document.getElementById('out').value);
  const b=document.getElementById('copy'); b.textContent='copied'; setTimeout(()=>b.textContent='copy',900);
};
document.getElementById('load').onclick=()=>document.getElementById('file').click();
document.getElementById('file').onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  const j=JSON.parse(await f.text());
  doc={}; for (const [ch,g] of Object.entries(j.glyphs||{}))
    doc[ch]={contours:(g.contours||[]).map(p=>p.map(([x,y])=>({x,y})))};
  redraw();
};
for (const id of ['op','zm','grid','snap','fill']) document.getElementById(id).oninput=redraw;
addEventListener('resize', redraw);
redraw();
</script>
</body>
</html>
