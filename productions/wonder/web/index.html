<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>wonder — Sunflower (1999) — web restoration</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; background: #000; overflow: hidden; }
    body { display: grid; place-items: center; color: #fff; font: 14px system-ui, sans-serif; }
    canvas { width: min(100vw, calc(100vh * 4 / 3)); height: min(100vh, calc(100vw * 3 / 4)); }
    #status { position: fixed; inset: auto 1rem 1rem; opacity: .75; }
    #start { position: fixed; inset: 1rem 1rem auto auto; padding: .6rem 1rem; color: #fff;
      border: 1px solid #777; background: #111c; cursor: pointer; }
    #start[hidden] { display: none; }
    #inspector { position: fixed; inset: 1rem auto auto 1rem; padding: .45rem .7rem;
      color: #b9ff65; border: 1px solid #536c39; background: #111c; text-decoration: none; }
    html.embedded #status, html.embedded #inspector { display: none; }
  </style>
</head>
<body>
  <canvas id="screen" width="640" height="480"></canvas>
  <a id="inspector" href="./timeline.html">Open XM order inspector</a>
  <button id="start" type="button">Start with sound</button>
  <div id="status">Wonder restoration foundation</div>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
